name: Build iOS App

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            ~/.gradle/configuration-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native build outputs
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/shared/build/bin
            ${{ github.workspace }}/shared/build/klib
            ${{ github.workspace }}/shared/build/compileSync
          key: ${{ runner.os }}-kn-build-${{ hashFiles('shared/src/**', 'shared/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-kn-build-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Diagnose build environment
        run: |
          echo "=== Build Environment Diagnosis ==="
          echo "OS: $(uname -a)"
          echo "Architecture: $(uname -m)"
          echo "Xcode version: $(xcodebuild -version)"
          echo "Xcode path: $(xcode-select -p)"
          echo "Java version: $(java -version 2>&1 | head -n 1)"
          echo "Gradle version: $(./gradlew --version 2>&1 | grep 'Gradle' | awk '{print $2}')"
          echo "Kotlin version: $(grep 'kotlin =' gradle/libs.versions.toml | sed 's/.*\"\([^\"]*\)\".*/\1/')"
          echo "=== End Diagnosis ==="

      - name: Build shared Kotlin framework
        id: ios-build
        run: |
          echo "=== Starting iOS Framework Build ==="
          echo "Xcode version: $(xcodebuild -version)"
          echo "Architecture: $(uname -m)"
          
          export SDK_NAME="iphoneos"
          export ARCHS="arm64"
          export CONFIGURATION="Debug"
          export PLATFORM_NAME="iphoneos"
          export TARGET_BUILD_DIR="$(pwd)/build/ios"
          export FRAMEWORKS_FOLDER_PATH="Frameworks"
          export EXPANDED_CODE_SIGN_IDENTITY=""
          export EXPANDED_CODE_SIGN_IDENTITY_NAME=""
          export CODE_SIGNING_ALLOWED="NO"
          export CODE_SIGNING_REQUIRED="NO"
          export ENABLE_USER_SCRIPT_SANDBOXING="NO"
          
          echo "::group::Building iOS Framework (Debug)"
          ./gradlew :shared:linkDebugFrameworkIosArm64 \
            --no-configuration-cache \
            --quiet \
            -Dorg.gradle.jvmargs="-Xmx3g" || {
            echo "::error::iOS framework linking failed"
            exit 1
          }
          echo "::endgroup::"
          
          echo "::group::Building iOS Framework (Release)"
          ./gradlew :shared:linkReleaseFrameworkIosArm64 \
            --no-configuration-cache \
            --quiet \
            -Dorg.gradle.jvmargs="-Xmx3g" || {
            echo "::error::iOS framework linking failed"
            exit 1
          }
          echo "::endgroup::"
          
          echo "=== iOS Framework Build Completed ==="

      - name: Build iOS app (debug)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --color || true

      - name: Build iOS app for device (release)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --color || true

      - name: Build Release App
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO || {
            echo "::error::Build failed"
            exit 1
          }

      - name: Package Unsigned IPA
        run: |
          APP_PATH=$(find build/derived/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find .app bundle"
            exit 1
          fi
          
          # Remove any existing code signatures
          codesign --remove-signature "$APP_PATH" 2>/dev/null || true
          find "$APP_PATH" -name "*.framework" -exec codesign --remove-signature {} \; 2>/dev/null || true
          find "$APP_PATH" -name "*.dylib" -exec codesign --remove-signature {} \; 2>/dev/null || true
          
          mkdir -p build/ipa-output/Payload
          cp -R "$APP_PATH" build/ipa-output/Payload/
          (cd build/ipa-output && zip -r -y KotlinProject.ipa Payload)
          rm -rf build/ipa-output/Payload
          
          ls -la build/ipa-output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned-ipa
          path: build/ipa-output/*.ipa
          retention-days: 7

  build-ios-archive:
    name: Build iOS Archive (Signed)
    runs-on: macos-15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build-ios

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shared Kotlin framework
        run: |
          export SDK_NAME="iphoneos"
          export ARCHS="arm64"
          export CONFIGURATION="Release"
          export PLATFORM_NAME="iphoneos"
          export TARGET_BUILD_DIR="$(pwd)/build/ios"
          export FRAMEWORKS_FOLDER_PATH="Frameworks"
          export EXPANDED_CODE_SIGN_IDENTITY=""
          export EXPANDED_CODE_SIGN_IDENTITY_NAME=""
          export CODE_SIGNING_ALLOWED="NO"
          export CODE_SIGNING_REQUIRED="NO"
          export ENABLE_USER_SCRIPT_SANDBOXING="NO"
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-configuration-cache

      - name: Build iOS Archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISION_PROFILE_NAME }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA
        run: |
          mkdir -p build/ipa-export
          cat > build/ipa-export/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.IOS_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ secrets.IOS_BUNDLE_ID }}</key>
                  <string>${{ secrets.IOS_PROVISION_PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/iosApp.xcarchive \
            -exportPath build/ipa-output \
            -exportOptionsPlist build/ipa-export/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ipa-output/*.ipa
          retention-days: 30

      - name: Upload to App Store Connect
        if: vars.UPLOAD_TO_APP_STORE == 'true'
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ipa-output/*.ipa \
            --apiKey "${{ secrets.APP_STORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_API_ISSUER_ID }}"
